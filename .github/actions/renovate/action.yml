name: Run Renovate
description: Open repository-local dependency update pull requests with the built-in token.
inputs:
  token:
    description: Repository GITHUB_TOKEN with contents, issues, and pull requests write access.
    required: true
runs:
  using: composite
  steps:
    - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
      with:
        token: ${{ inputs.token }}
        renovate-version: '44.247.2'
      env:
        RENOVATE_PLATFORM: github
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        RENOVATE_AUTODISCOVER: 'false'
        RENOVATE_ONBOARDING: 'false'
        RENOVATE_REQUIRE_CONFIG: required
        RENOVATE_USERNAME: github-actions[bot]
        RENOVATE_GIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
